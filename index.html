<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Rating Component</title>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div style="max-width: 550px; width: 100%;">
      <div class="card bg-white rounded-4 border-0 shadow-lg p-3">
        <div class="card-body">
          
          <div class="row align-items-center mb-4">
            <div class="col-7">
              <h3 class="fw-bold text-dark lh-sm mb-0"> What others think about the product</h3>
            </div>
            <div class="col-5">
              <div class="card border rounded-3 shadow-sm text-center py-2 bg-white">
                <div class="card-body p-2">
                  <h3 class="mb-0 fw-bold"> <i class="fa-solid fa-star text-warning"></i> 4.8</h3>
                  <p class="text-muted mb-0" style="font-size: 0.85rem;">Average Rating</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Search -->
          <div class="row mb-4">
            <div class="col-12">
              <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden border">
                <span class="input-group-text bg-white border-0 ps-3"> <i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" class="form-control border-0 shadow-none ps-0" placeholder="Search Reviews">
              </div>
            </div>
          </div>

          <!-- Ratings -->
          <h4 class="mb-3 fw-bold fs-5">Ratings</h4>

          <!-- 5 -->
          <div class="d-flex align-items-center mb-2">
            <span class="me-3 text-nowrap text-secondary" style="width: 30px; font-weight: 500;">5 <i class="fa-solid fa-star text-warning"></i></span>
            <div class="progress flex-grow-1 bg-light border" style="height: 10px;">
              <div class="progress-bar bg-warning rounded-pill" role="progressbar" style="width: 80%;"></div>
            </div>
          </div>

          <!-- 4 -->
          <div class="d-flex align-items-center mb-2">
            <span class="me-3 text-nowrap text-secondary" style="width: 30px; font-weight: 500;">4 <i class="fa-solid fa-star text-warning"></i></span>
            <div class="progress flex-grow-1 bg-light border" style="height: 10px;">
              <div class="progress-bar bg-warning rounded-pill" role="progressbar" style="width: 60%;"></div>
            </div>
          </div>

          <!-- 3 -->
          <div class="d-flex align-items-center mb-2">
            <span class="me-3 text-nowrap text-secondary" style="width: 30px; font-weight: 500;">3 <i class="fa-solid fa-star text-warning"></i></span>
            <div class="progress flex-grow-1 bg-light border" style="height: 10px;">
              <div class="progress-bar bg-warning rounded-pill" role="progressbar" style="width: 30%;"></div>
            </div>
          </div>

          <!-- 2 -->
          <div class="d-flex align-items-center mb-2">
            <span class="me-3 text-nowrap text-secondary" style="width: 30px; font-weight: 500;">2 <i class="fa-solid fa-star text-warning"></i></span>
            <div class="progress flex-grow-1 bg-light border" style="height: 10px;">
              <div class="progress-bar bg-warning rounded-pill" role="progressbar" style="width: 10%;"></div>
            </div>
          </div>

          <!-- 1 -->
          <div class="d-flex align-items-center mb-2">
            <span class="me-3 text-nowrap text-secondary" style="width: 30px; font-weight: 500;">1 <i class="fa-solid fa-star text-warning"></i></span>
            <div class="progress flex-grow-1 bg-light border" style="height: 10px;">
              <div class="progress-bar bg-warning rounded-pill" role="progressbar" style="width: 27%;"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
